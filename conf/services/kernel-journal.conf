# You can put comments anywhere you want to.  They are effective for the
# rest of the line.

# this is in the format of <name> = <value>.  Whitespace at the beginning
# and end of the lines is removed.  Whitespace before and after the = sign
# is removed.  Everything is case *insensitive*.

# Yes = True  = On  = 1
# No  = False = Off = 0

Title = "Kernel"

# This is the journald-sourced counterpart to the 'kernel' service (see
# conf/services/kernel.conf), for hosts that have no /var/log/messages (or
# similar) file -- e.g. Proxmox VE, or any other journald-only system.
# Instead of reading a logfile group, it pulls kernel/dmesg messages
# straight out of the systemd journal.
#
# Runs by default (Service = All in logwatch.conf), alongside the plain
# 'kernel' service -- logwatch has no config-level way for one service to
# disable another, so scripts/services/kernel-journal self-excludes at
# runtime instead: it exits immediately with no output if journalctl
# isn't found, or if a populated /var/adm/messages or /var/log/messages
# already exists (in which case 'kernel' already covers this host). No
# manual Service toggling needed on either service.
LogFile = none
*JournalCtl = "--no-pager -k"

# Only give lines pertaining to the kernel service...
*OnlyService = (kernel|SUNW,[-\w]+?)
*RemoveHeaders

# All of the $-tunables below are documented in, and shared with, the
# plain 'kernel' service (they are read by the same underlying parser):
#   $ignore_cpu_throttled
#   $ignore_faults
#   $ignore_rpcsec_expired
#   $kernel_ignore_messages
# See conf/services/kernel.conf for details on each.

# vi: shiftwidth=3 tabstop=3 et
